# The public viewer on GitHub Pages: built by tools/pages.js on every push to main (PAGES.md).
# The build refuses to publish anything from local/, any image, song or video, or a level that is not ours.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # until Pages is switched on for the repo, a push does nothing here (no failing runs)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/pages.js --out _site
      - run: node tests/pages_build.js _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
