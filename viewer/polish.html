<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polish: before / after</title>
<!-- Before / after of a polished level (tools/polish.js, POLISH.md), both drawn by the viewer
     (viewer/index.html in #embed mode) on one clock, in GD-art mode, with the change list.
     Open through tools/serve.js: http://localhost:8765/viewer/polish.html#c=local/polish/<slug>_polished.compare.json
     Without #c it lists every compare file in local/polish/ (GET /polish/list). -->
<style>
  :root { --bg:#0b0620; --panel:#160d33; --ink:#e8e4ff; --dim:#8b84b8; --ok:#3dffb0; --bad:#ff3b6b; --hi:#ffe14d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); }
  h1 { font-size:15px; margin:0 8px 0 0; color:var(--ok); letter-spacing:.04em; }
  select, button { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#3b2d78; border-color:var(--ok); }
  #views { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  @media (max-width:800px) { #views { grid-template-columns:1fr; } }
  .view h2 { margin:0; padding:4px 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); background:var(--panel); }
  iframe { display:block; width:100%; height:min(46vh, 400px); border:0; background:#0e0828; }
  #scrub { width:100%; margin:0; accent-color:var(--ok); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:12px 16px 24px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h3 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #2a1f57; vertical-align:top; }
  tr.go { cursor:pointer; } tr.go:hover td { color:var(--hi); }
  .muted { color:var(--dim); } .up { color:var(--ok); } .down { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>POLISH: BEFORE / AFTER</h1>
  <select id="pick"></select>
  <button id="play">▶ play</button><button id="restart">⟲</button>
  <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
  <button id="art" class="on">GD art</button><button id="hit">hitboxes</button><button id="music" class="on">music</button>
  <span id="clock" class="muted"></span>
</header>
<div id="views">
  <div class="view"><h2 id="bName">before</h2><iframe id="fb" src="index.html#embed=1"></iframe></div>
  <div class="view"><h2 id="aName">after</h2><iframe id="fa" src="index.html#embed=1"></iframe></div>
</div>
<input id="scrub" type="range" min="0" max="1000" value="0">
<main>
  <div class="card"><h3>Numbers</h3><div id="nums"></div></div>
  <div class="card"><h3>Changes (click one to jump there)</h3><div id="changes"></div></div>
  <div class="card" style="grid-column:1/-1"><h3>Every input's timing window</h3><div id="wins"></div></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const fb = $("fb"), fa = $("fa");
let C = null, t = 0, playing = false, speed = 1, art = true, hit = false, music = true, song = null, len = 0;
const ready = f => new Promise(r => { const ok = () => f.contentWindow && f.contentWindow.VIEWER; if (ok()) return r(); const i = setInterval(() => { if (ok()) { clearInterval(i); r(); } }, 50); });
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

async function open(file) {
  C = await (await fetch("/" + file, { cache: "no-store" })).json();
  await Promise.all([ready(fb), ready(fa)]);
  for (const [f, s] of [[fb, C.before], [fa, C.after]]) { const V = f.contentWindow.VIEWER; try { V.load(s.name, s.level, s.solution, s.song); V.setArt(art); V.setHit(hit); } catch (e) { console.warn(e); } }
  $("bName").textContent = "before — " + C.before.name; $("aName").textContent = "after — " + C.after.name;
  len = Math.max(fb.contentWindow.VIEWER.len, fa.contentWindow.VIEWER.len);
  if (song) song.pause();
  song = C.after.song && C.after.song.url ? new Audio(C.after.song.url) : null;
  t = +(new URLSearchParams(location.hash.slice(1)).get("t")) || 0; playing = false; setPlay(); seek(t);
  panels();
}
function panels() {
  const b = C.before.numbers, a = C.after.numbers;
  const row = (k, x, y, better) => { const d = y === x ? "" : (better(y, x) ? "up" : "down"); return `<tr><td>${k}</td><td>${x ?? "?"}</td><td class="${d}">${y ?? "?"}</td></tr>`; };
  const more = (y, x) => y > x, less = (y, x) => y < x;
  let h = `<table><tr><th></th><th>before</th><th>after</th></tr>` +
    row("tightest window (ms)", b.tightestMs, a.tightestMs, more) + row("median window (ms)", b.medianMs, a.medianMs, more) +
    row("windows under 34 ms", b.under, a.under, less) + row("windows under 1 frame", b.under1frame, a.under1frame, less) +
    row("prejumps (sight-read check)", b.prejumps, a.prejumps, less) + row("decoration objects", b.deco, a.deco, more) + row("objects", b.objects, a.objects, () => true);
  if (C.sync) h += row(`orbs on a beat (${C.sync.bpm.toFixed(0)} BPM)`, `${C.sync.before.orbs}/${C.sync.before.nOrbs}`, `${C.sync.after.orbs}/${C.sync.after.nOrbs}`, (y, x) => parseInt(y) > parseInt(x)) +
    row("portals on a bar", `${C.sync.before.portals}/${C.sync.before.nPortals}`, `${C.sync.after.portals}/${C.sync.after.nPortals}`, (y, x) => parseInt(y) > parseInt(x));
  $("nums").innerHTML = h + `</table><p class="muted">Both solve on the current physics. ${esc(C.source)} → ${esc(C.out)}, made ${new Date(C.made).toLocaleString()}.</p>`;
  $("changes").innerHTML = `<table>` + C.changes.map((c, i) => c.kept
    ? `<tr class="${c.x != null ? "go" : ""}" data-x="${c.x ?? ""}"><td>${c.pass}</td><td class="muted">kept: ${esc(c.what)} — ${esc(c.why)}</td></tr>`
    : `<tr class="${c.x != null ? "go" : ""}" data-x="${c.x ?? ""}"><td>${c.pass}</td><td>${esc(c.what)}: ${esc(c.change)} <span class="muted">(${esc(c.before)} → ${esc(c.after)})</span></td></tr>`).join("") + `</table>`;
  document.querySelectorAll("tr.go").forEach(tr => tr.onclick = () => goX(+tr.dataset.x - 150));
  const wb = C.windows.before, wa = C.windows.after;
  $("wins").innerHTML = `<table><tr><th>block</th><th>input</th><th>mode</th><th>before</th><th>after</th></tr>` + wb.map((x, k) => { const y = wa[k] || {};
    return `<tr class="go" data-x="${x.x}"><td>${(x.x / 30).toFixed(1)}</td><td>${x.type}</td><td>${x.mode}</td><td>${x.ms} ms${x.bounded ? "+" : ""}</td><td class="${y.ms > x.ms ? "up" : y.ms < x.ms ? "down" : ""}">${y.ms ?? "-"} ms${y.bounded ? "+" : ""}</td></tr>`; }).join("") + `</table>`;
  document.querySelectorAll("#wins tr.go").forEach(tr => tr.onclick = () => goX(+tr.dataset.x - 150));
}
// a change's x -> the time the after-run gets there (the after plan is the one shown)
function goX(x) { const V = fa.contentWindow; const p = V.VIEWER.timeOfX(x); seek(Math.max(0, p)); playing = false; setPlay(); }
function seek(tt) { t = Math.max(0, Math.min(tt, len)); fb.contentWindow.VIEWER.seek(t); fa.contentWindow.VIEWER.seek(t); $("scrub").value = len ? t / len * 1000 : 0; $("clock").textContent = t.toFixed(2) + " s";
  if (song && playing && music) { const want = (C.after.song.offset || 0) + t; if (Math.abs(song.currentTime - want) > 0.08) song.currentTime = want; } }
function setPlay() { $("play").textContent = playing ? "❚❚ pause" : "▶ play"; if (song) { if (playing && music) { song.playbackRate = speed; song.currentTime = (C.after.song.offset || 0) + t; song.play().catch(() => {}); } else song.pause(); } }
$("play").onclick = () => { if (t >= len) t = 0; playing = !playing; setPlay(); };
$("restart").onclick = () => { t = 0; playing = true; setPlay(); };
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); setPlay(); });
$("art").onclick = e => { art = !art; e.target.classList.toggle("on", art); fb.contentWindow.VIEWER.setArt(art); fa.contentWindow.VIEWER.setArt(art); };
$("hit").onclick = e => { hit = !hit; e.target.classList.toggle("on", hit); fb.contentWindow.VIEWER.setHit(hit); fa.contentWindow.VIEWER.setHit(hit); };
$("music").onclick = e => { music = !music; e.target.classList.toggle("on", music); setPlay(); };
$("scrub").oninput = () => { playing = false; setPlay(); seek($("scrub").value / 1000 * len); };
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); $("play").onclick(); } });
let prev = performance.now();
function frame(now) { const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (C && playing) { t += dt * speed; if (song && music && !song.paused) { const err = song.currentTime - (C.after.song.offset || 0) - t; if (Math.abs(err) < 0.25) t += err * 0.2; }
    if (t >= len) { t = len; playing = false; setPlay(); } seek(t); }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
(async () => {
  let list = []; try { list = await (await fetch("/polish/list", { cache: "no-store" })).json(); } catch (e) {}
  const want = new URLSearchParams(location.hash.slice(1)).get("c");
  if (want && !list.includes(want)) list.unshift(want);
  list.forEach(f => $("pick").add(new Option(f.replace(/^local\/polish\//, "").replace(/\.compare\.json$/, ""), f)));
  $("pick").onchange = () => { history.replaceState(null, "", "#c=" + encodeURIComponent($("pick").value)); open($("pick").value); };
  if (list.length) { $("pick").value = want || list[0]; open($("pick").value); }
  else $("nums").textContent = "No polished levels yet: node tools/polish.js <level.gdlvl>";
})();
</script>
</body>
</html>
