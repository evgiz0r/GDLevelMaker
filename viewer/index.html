<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Level Viewer</title>
<style>
  :root { --bg:#0b0620; --panel:#160d33; --ink:#e8e4ff; --dim:#8b84b8; --block:#3d7bff; --spike:#ff3b6b; --cube:#3dffb0; --click:#ffe14d; --win:rgba(255,225,77,.13); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.04em; color:var(--cube); }
  select, button, label.btn { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#3b2d78; border-color:var(--cube); }
  #wrap { position:relative; }
  canvas { display:block; width:100%; height:min(60vh, 460px); background:#0e0828; touch-action:none; }
  #scrub { width:100%; margin:0; accent-color:var(--cube); }
  #strip { display:block; width:100%; height:34px; background:#120a2e; cursor:pointer; }
  #varbar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 10px; background:#140b33; border-top:1px solid #2b2060; font-size:13px; }
  #varbar .vsec { display:flex; gap:4px; align-items:center; }
  #varbar .vname { color:#c9bdf8; margin-right:2px; }
  #varbar button { padding:3px 8px; font-size:12px; }
  #varbar button.cur { border-color:var(--cube); background:#3b2d78; }
  #varbar button.close { border-color:#ffb020; }
  #inbar { display:block; width:100%; height:58px; background:#0b0620; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:12px 16px 24px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .ok { color:var(--cube); } .bad { color:var(--spike); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #2a1f57; }
  tr.now td { color:var(--click); }
  .muted { color:var(--dim); }
  canvas.marking { cursor:crosshair; }
  tr.done td { color:var(--dim); text-decoration:line-through; }
  #views.split { display:grid; grid-template-columns:1fr 1fr; }
  #views.split canvas, #views.split #cmpImg { height:auto; aspect-ratio:16/9; }
  #cmp { background:#000; display:flex; flex-direction:column; }
  #cmp[hidden] { display:none; }
  .cmpbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:4px 6px; background:var(--panel); }
  .cmpbar input { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:4px; }
  #cmpImg { width:100%; height:min(60vh, 460px); object-fit:contain; object-position:center top; }
  @media (max-width: 700px) { #views.split { grid-template-columns:1fr; } }
  #drop { position:absolute; inset:0; display:none; place-items:center; background:rgba(11,6,32,.85); font-size:18px; border:2px dashed var(--cube); }
  #picker { position:fixed; inset:0; z-index:50; background:rgba(6,3,20,.72); display:flex; justify-content:center; align-items:flex-start; padding:4vh 12px; }
  #picker[hidden] { display:none; }
  #pk { width:min(860px,100%); max-height:92vh; display:flex; flex-direction:column; background:#160d3a; border:1px solid #3b2d78; border-radius:10px; overflow:hidden; }
  #pkTop { display:flex; gap:8px; flex-wrap:wrap; padding:10px; border-bottom:1px solid #2b2060; align-items:center; }
  #pkQ { flex:1 1 220px; min-width:160px; background:#0e0828; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:8px 10px; font:inherit; }
  #pkTop button.on { border-color:var(--cube); background:#3b2d78; }
  #pkList { overflow-y:auto; padding:6px; }
  .pkHead { color:#9c8ee0; font-size:12px; margin:8px 6px 4px; text-transform:uppercase; letter-spacing:.06em; }
  .pkCard { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .pkCard:hover, .pkCard.sel { background:#24184f; border-color:#4a3a98; }
  .pkCard canvas { width:200px; height:34px; flex:0 0 auto; border-radius:4px; background:#0b0620; }
  .pkInfo { flex:1; min-width:0; }
  .pkName { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pkMeta { font-size:12px; color:#a99ce6; margin-top:2px; }
  .pkBadge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; background:#2c2166; color:#d8d0ff; margin-right:4px; }
  .pkBadge.wip { background:#5a3a10; color:#ffd58a; }
  .pkPin { background:none; border:none; font-size:18px; color:#6b5bd0; cursor:pointer; padding:4px 6px; }
  .pkPin.on { color:#ffe14d; }
  .pkOlder { font-size:12px; margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; }
  .pkOlder button { font-size:11px; padding:2px 6px; }
  @media (max-width:700px) { #picker { padding:0; } #pk { max-height:100vh; height:100vh; border-radius:0; } .pkCard { padding:12px 8px; } .pkCard canvas { width:120px; } #pkTop button { padding:10px 12px; } }
</style>
</head>
<body>
<div id="picker" hidden><div id="pk" role="dialog" aria-label="choose a level">
  <div id="pkTop"><input id="pkQ" type="search" placeholder="search levels…" autocomplete="off">
    <button data-f="all" class="on">all</button><button data-f="ours">ours</button><button data-f="wip">in progress</button><button data-f="official">official</button><button data-f="community">community</button><button data-f="pinned">★ pinned</button>
    <button id="pkClose" title="close (Esc)">✕</button></div>
  <div id="pkList"></div></div></div>
<header>
  <h1>GD LEVEL VIEWER</h1>
  <select id="pick" hidden></select><button id="pickBtn" title="choose a level (key L)">📂 <span id="pickName">levels</span></button>
  <button id="refresh" title="get the newest version of the sessions' levels">⟳ refresh</button>
  <button id="linkBtn" title="copy a link to this level at this moment">🔗 link</button>
  <label class="btn">open .gdlvl<input id="file" type="file" accept=".gdlvl,.txt" hidden></label>
  <button id="play">▶ play</button>
  <button id="restart">⟲</button>
  <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
  <button id="lookBtn" class="on" title="colours, triggers, block skins as in the game (off: the schematic view)">game look</button>
  <button id="artBtn" title="draw objects, background, ground and icon with GD's own sprites from your game install (needs tools/serve.js; VISUALS.md)">GD art</button>
  <button id="mapBtn" title="the whole level as one picture with its path (make it with node tools/levelmap.js <level>)">level map</button>
  <button id="hit">hitboxes</button>
  <button id="cmpBtn" hidden title="a frame of your recording next to the replay (needs tools/serve.js)">compare</button>
  <button id="markBtn" title="pause, then click where something should change (key M)">✎ mark</button>
  <button id="sound" class="on">click sound</button>
  <button id="music" class="on">music</button><label class="btn" id="addSongPc" hidden>add song<input id="songFilePc" type="file" accept="audio/*,.mp3,.ogg,.m4a,.wav" hidden></label>
  <button id="lightBtn" title="light mode: no GD art, no beat lines -- for a slow moment (the PC busy, the phone)">light</button>
  <button id="beatsBtn" class="on" title="beat grid of the level's song (songs on this PC, from tools/beats.js)">beats</button>
  <span id="clock" class="muted"></span>
</header>
<div id="views"><div id="wrap"><canvas id="cv"></canvas><canvas id="inbar" title="the button. Middle lane: what the replay presses -- a tap is a short white mark with a dot, a hold a yellow bar with its length. Top lane: each input's timing window, the whole range of moments that still work (cyan for a press, pink for a release): a long window is room, not a long press."></canvas><div id="drop">drop a .gdlvl here</div></div>
<div id="cmp" hidden><div class="cmpbar"><select id="cmpRec"></select>
  <label title="where this level's attempt starts in the video: replay time t shows video second (start + t)">level starts at <input id="cmpT0" type="number" step="0.1" value="0" style="width:5em"> s</label>
  <button data-dt="-1">-1 s</button><button data-dt="-0.1">-0.1</button><button data-dt="0.1">+0.1</button><button data-dt="1">+1 s</button>
  <button id="cmpShot" title="replay + game frame as one PNG in local/shots/">save comparison</button>
  <span id="cmpAt" class="muted"></span></div><img id="cmpImg" alt="game frame"></div></div>
<div id="varbar" hidden></div>
<canvas id="strip"></canvas>
<input id="scrub" type="range" min="0" max="1000" value="0">
<main>
  <div class="card"><h2>Level</h2><div id="summary"></div></div>
  <div class="card"><h2>Clicks</h2><div id="clicks"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Marks — what to change</h2><div id="marks"></div></div>
</main>
<div id="ver" class="muted" style="font-size:12px;padding:6px 16px 14px"></div>
<script src="../lib/gd.js"></script>
<script src="../lib/objects_extra.js"></script>
<script src="../lib/objects_gd22.js"></script>
<script src="../lib/objects.js"></script>
<script src="../lib/dual.js"></script>
<script src="../lib/physics.js"></script>
<script src="../lib/sync.js"></script>
<script src="../lib/look.js"></script>
<script src="../lib/vfx.js"></script>
<script src="../lib/objects_art.js"></script>
<script src="../lib/objects_frames.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/natural.js"></script>
<script src="../lib/song.js"></script>
<script src="../lib/difficulty.js"></script>
<script src="../lib/windows.js"></script>
<script src="levels.js"></script>
<script src="levels.local.js" onerror="window.GD_LEVELS_LOCAL = []"></script>
<script src="../local/beats.local.js" onerror="window.GD_BEATS = {}"></script>
<script>
"use strict";
const P = GD.PHYS;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
// shoot mode (tools/shoot.js): ?shoot=<job> renders a level's frames headless, without the overlays
const SHOOT = new URLSearchParams(location.search).get("shoot");
let MAPCAM = null; // level map (tools/levelmap.js): a fixed camera {x, y, scale, groundY}, no player
let L = null;          // {name, objects, world, sol, path}
let t = 0, playing = false, speed = 1, showHit = false, sound = true, lastTick = -1;

// ---------- loading ----------
async function gunzipB64(b64) {
  const bytes = GD.b64urlToBytes(b64);
  const ds = new DecompressionStream("gzip");
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(buf);
}
// ---------- the public site (tools/pages.js sets window.GD_PAGES) ----------
// Nothing copyrighted is hosted there. Songs, GD's own art and the official levels come from the user's OWN
// tools/serve.js on this PC when it runs (http://localhost:8765 answers the Pages origin, CORS); anywhere else
// that fails quietly: the shapes look, our levels, a song the visitor picks from their own device, or the
// click sound. LOCALBASE is "" on the PC viewer itself (same server).
let LOCALBASE = "";
const LOCAL_URL = "http://localhost:8765";
const localReady = !window.GD_PAGES ? Promise.resolve(location.protocol.startsWith("http"))
  : fetch(LOCAL_URL + "/version", { cache: "no-store" }).then(r => { if (r.ok) LOCALBASE = LOCAL_URL; return r.ok; }).catch(() => false);
// the song file a visitor picked, kept in this browser per song (IndexedDB; a convenience: all works without it)
function songDb() {
  return new Promise((ok, no) => { try { const r = indexedDB.open("gdlm-songs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("songs"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } });
}
async function keptSong(key) { try { const db = await songDb(); return await new Promise(ok => { const q = db.transaction("songs").objectStore("songs").get(key); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } }
async function keepSong(key, bytes) { try { const db = await songDb(); db.transaction("songs", "readwrite").objectStore("songs").put(bytes, key); } catch (e) {} }
// the level's song: fetched from tools/serve.js once, decoded, played sample-exact by lib/song.js (Web Audio);
// while playing, the replay's clock IS the song's clock (frame()), so they cannot drift apart
let song = null, songInfo = null, music = true;
const SONGS = (GD.SONGBUF = GD.SONGBUF || {}), songKeyOf = info => decodeURIComponent(String(info.url).split("/").pop()).toLowerCase();
function audioCtx() { actx = actx || new AudioContext(); return actx; }
function viewerSong(info) {
  const buf = SONGS[songKeyOf(info)];
  if (buf) return GD.songPlayer(buf, audioCtx);
  loadSong(info); return null;
}
const songLoading = {};
async function loadSong(info) {
  const k = songKeyOf(info); if (songLoading[k]) return; songLoading[k] = true;
  try {
    let bytes = await keptSong(k);
    if (!bytes) { const ok = await localReady; if (!ok || (window.GD_PAGES && !LOCALBASE)) { songLoading[k] = false; songAsk(true); return; }
      const r = await fetch(LOCALBASE + info.url); if (!r.ok) { songLoading[k] = false; songAsk(true); return; } bytes = await r.arrayBuffer(); }
    SONGS[k] = await audioCtx().decodeAudioData(bytes.slice(0));
  } catch (e) { songLoading[k] = false; songAsk(true); return; }
  songAsk(false);
  if (songInfo && songKeyOf(songInfo) === k && !song) { song = GD.songPlayer(SONGS[k], audioCtx); syncSong(true); }
}
// "add song": shown when the level has a song this page cannot get (the public site away from the user's PC).
// The visitor picks the file from their own device; it is decoded here and kept per song id in this browser.
function songAsk(show) {
  const b = document.getElementById("addSongPc"); if (!b) return;
  b.hidden = !show || !songInfo; if (show && songInfo) b.title = "this level's song (" + songKeyOf(songInfo) + ") is not here: pick the file from your device";
}
document.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("songFilePc"); if (!inp) return;
  inp.onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f || !songInfo) return;
    const k = songKeyOf(songInfo), bytes = await f.arrayBuffer();
    try { SONGS[k] = await audioCtx().decodeAudioData(bytes.slice(0)); } catch (err) { alert("That file could not be played as a song. An mp3 or ogg works."); return; }
    keepSong(k, bytes); songAsk(false); const was = playing; setSong(songInfo); if (was) syncSong(true); };
});
function setSong(info) {
  if (song) { song.pause(); song = null; }
  songInfo = info || null;
  if (!info) { songAsk(false); return; }
  if (location.protocol === "file:") return; // songs come from tools/serve.js
  song = viewerSong(info);
}
// keep the song where the replay is: level time t plays song second offset + t. Seeks only when asked
// (play, restart, scrub, speed): never from the frame loop, which reads the song's clock instead
function syncSong(force) {
  if (!song) return;
  if (!playing || !music) { if (!song.paused) song.pause(); return; }
  song.playbackRate = speed;
  const want = songInfo.offset + t;
  if (song.paused) { song.currentTime = want; song.play(); }
  else if (force && Math.abs(song.currentTime - want) > 0.002) song.currentTime = want;
}
function load(name, levelStr, saved, info) {
  setSong(info);
  const level = GD.parseLevel(levelStr);
  const world = GD.makeWorld(level.objects, level.header);
  let sol;
  if (saved) sol = saved.ok ? { ok: true, events: saved.events, clicks: [] } : { ok: false, trail: saved.events, clicks: [], dieAt: { x: saved.dieX || 0, tick: 0 }, why: saved.why || "" };
  else try { sol = GD.solveAny(world); } catch (e) { sol = { ok: false, clicks: [], trail: [], dieAt: GD.startState(world), why: e.message }; }
  // the replay shows a natural way to play it (lib/natural.js: a tap per jump, no empty jumps, the
  // ship and wave flown along the middle of their corridor), not the solver's fewest-presses run
  // ("the path is unnatural ... empty clicks ... the ship looks like a wave", playtest). The
  // "solver run" button shows the solver's own. Timing windows in the table stay the solver's.
  if (sol.ok && !saved && GD.naturalPlan && !window.SOLVER_RUN) {
    try {
      const n = GD.naturalPlan(world, sol, level.objects);
      if (n && n.path[n.path.length - 1].done) {
        const ms = sol.clicks.filter(c => c.type === "press").map(c => c.ms);
        sol = Object.assign({}, sol, { events: n.events, natural: true,
          clicks: n.events.map(e => ({ type: e.type, tick: e.tick, lo: e.tick, hi: e.tick, ms: 0 })) });
      }
    } catch (e) { console.warn("natural plan failed:", e); }
  }
  // a level that cannot be beaten replays the run that got furthest
  let events = sol.events;
  if (!sol.ok) {
    events = [];
    (sol.trail || []).forEach((e, i, a) => { events.push(e); if (e.type === "press" && !(a[i + 1] && a[i + 1].type === "release")) events.push({ tick: e.tick + 1, type: "release" }); });
    sol.clicks = (sol.trail || []).filter(e => e.type === "press").map(e => ({ type: "press", tick: e.tick, lo: e.tick, hi: e.tick, ms: 0, act: "" }));
  }
  const path = GD.run(world, events).path;
  if (saved && saved.ok) sol.clicks = saved.events.map(e => ({ type: e.type, tick: e.tick, lo: e.tick, hi: e.tick, ms: 0 }));
  sol.clicks.forEach(c => { if (c.type === "press") c.act = path[Math.min(c.tick + 1, path.length - 1)].act || c.act; c.x = path[Math.min(c.tick, path.length - 1)].x; });
  // button state at every step, for the hold strip and the button light
  const held = new Uint8Array(path.length);
  { const ev = (events || []).slice().sort((a, b) => a.tick - b.tick); let h = 0, j = 0;
    for (let k = 0; k < path.length; k++) { while (j < ev.length && ev[j].tick <= k) { h = ev[j].type === "press" ? 1 : 0; j++; } held[k] = h; } }
  L = { name, level, world, sol, path, held };
  L.vrot = visualRot(path);
  L.routeKind = routeKindOf(saved, sol, world);
  // colour / alpha / zoom triggers fire when the replayed run passes their x
  L.look = GD.LOOK.timeline(level, x => {
    let lo = 0, hi = path.length - 1;
    if (path[hi].x < x) return Infinity;
    while (lo < hi) { const m = (lo + hi) >> 1; if (path[m].x >= x) hi = m; else lo = m + 1; }
    return lo / P.TPS;
  });
  // the song's beat grid, when tools/beats.js has analysed it on this PC
  const grid = info && (window.GD_BEATS || {})[info.url];
  L.beats = grid ? { grid, offset: info.offset || 0, tl: GD.SYNC.timeline(world) } : null;
  t = 0; lastTick = -1; playing = false; setPlay();
  summary(); clickTable(); markTable(); if (cmpOn) cmpLoadSetting(); draw();
  windowsLater(L, events, saved);
}
// every input's whole timing window (lib/windows.js: a player's window, later inputs re-planned), worked out after
// the level shows, a slice at a time so the page stays live; the button strip shades each one and the
// click table lists it. Saved and natural replays come without windows (the user: show how much room
// there is, not only the chosen moment, which often sits near an edge).
// A saved solution carries them already (tools/solutions.js measures them once per level content, as it
// solves): then they show at once and nothing is measured here ("it resolves every time I select a level?").
function windowsLater(LL, events, saved) {
  if (window.SHOOT_MAP || !LL.sol.ok || !events || !events.length || LL.sol.clicks.some(c => c.hi > c.lo)) return;
  const byKey = new Map(LL.sol.clicks.map(c => [c.type + c.tick, c])), sorted = events.slice().sort((a, b) => a.tick - b.tick);
  const take = wins => { for (const wv of wins) { const c = byKey.get(wv.type + wv.tick); if (!c || c.ms) continue;
    Object.assign(c, { lo: wv.lo, hi: wv.hi, ms: Math.round((wv.hi - wv.lo + 1) / P.TPS * 1000) });
    if (wv.j >= 0) { const e = sorted[wv.j], rc = e && byKey.get(e.type + e.tick); if (rc) rc.tapOf = c; } } };
  const finish = () => { LL.windowsDone = true; LL.windowsBusy = false; summary(); clickTable(); draw(); };
  if (saved && saved.ok && Array.isArray(saved.windows)) {
    take(saved.windows.map(a => ({ type: a[0] ? "release" : "press", tick: a[1], lo: a[2], hi: a[3], j: a[4] })));
    LL.windowsSaved = true; return finish();
  }
  if (!GD.inputWindows) return;
  LL.windowsBusy = true; // the button band says "measuring windows…" meanwhile
  if (SHOOT) { take(GD.inputWindows(LL.world, events, LL.path, {})); return finish(); } // shots: all at once
  // a Web Worker (one input can take seconds; on the page that froze it), else slices on the page (file://)
  if (windowsLater.worker) windowsLater.worker.terminate();
  const libs = [...document.scripts].map(s => s.src).filter(u => /\/lib\/(gd|objects_extra|objects_gd22|objects|physics|difficulty|windows)\.js(\?.*)?$/.test(u));
  let wk = null; try { if (location.protocol.startsWith("http")) wk = new Worker("windows_worker.js"); } catch (e) {}
  if (wk) {
    windowsLater.worker = wk;
    wk.onmessage = e => {
      if (L !== LL) { wk.terminate(); return; } // another level was loaded
      if (e.data.wins) { take(e.data.wins); if (!playing) draw(); }
      if (e.data.done) { wk.terminate(); finish(); }
      if (e.data.error) { console.warn("timing windows:", e.data.error); wk.terminate(); }
    };
    wk.postMessage({ libs, objects: LL.level.objects, header: LL.level.header, events: sorted });
    return;
  }
  let from = 0;
  const slice = () => {
    if (L !== LL) return; // another level was loaded
    const r = GD.inputWindows(LL.world, events, LL.path, { from, out: [], budget: 40 });
    take(r);
    if (r.next === null) return finish();
    from = r.next; if (!playing) draw(); setTimeout(slice, 0);
  };
  setTimeout(slice, 50);
}
async function loadFile(f) {
  const rec = GD.parseRecord(await gunzipB64(await f.text()));
  load(GD.getField(rec, "k2") || f.name, await gunzipB64(GD.getField(rec, "k4")));
}
const pick = document.getElementById("pick");
const ALL = (window.GD_LEVELS || []).concat(window.GD_LEVELS_LOCAL || []);
if (window.GD_PAGES) localReady.then(ok => { if (!ok || !LOCALBASE) return;
  const sc = document.createElement("script"); sc.src = LOCALBASE + "/viewer/levels.local.js";

// ---------- drawing ----------
function tick() { return Math.min(L.path.length - 1, Math.floor(t * P.TPS)); }

let W = 0, H = 0, scale = 1, baseScale = 1, camX = 0, camY = 0, groundY = 0, LS = null;
function resize() {

addEventListener("resize", resize);

function draw() {

  // parallax ones locked to the player, rotations, toggles, camera offset; objects posed by it

  timeOfX(x) { if (!L) return 0; const i = L.path.findIndex(s => s.x >= x); return (i < 0 ? L.path.length - 1 : i) / P.TPS; },
  get t() { return t; }, get len() { return L ? (L.path.length - 1) / P.TPS : 0 },
  setArt(on) { if (art !== !!on) artBtn.onclick(); },
  setHit(on) { if (showHit !== !!on) document.getElementById("hit").onclick({ target: document.getElementById("hit") }); },
};
</script>
</body>
