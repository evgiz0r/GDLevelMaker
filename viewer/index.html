<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Level Viewer</title>
<style>
  :root { --bg:#0b0620; --panel:#160d33; --ink:#e8e4ff; --dim:#8b84b8; --block:#3d7bff; --spike:#ff3b6b; --cube:#3dffb0; --click:#ffe14d; --win:rgba(255,225,77,.13); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.04em; color:var(--cube); }
  select, button, label.btn { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#3b2d78; border-color:var(--cube); }
  #wrap { position:relative; }
  canvas { display:block; width:100%; height:min(60vh, 460px); background:#0e0828; touch-action:none; }
  #scrub { width:100%; margin:0; accent-color:var(--cube); }
  #strip { display:block; width:100%; height:34px; background:#120a2e; cursor:pointer; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:12px 16px 24px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .ok { color:var(--cube); } .bad { color:var(--spike); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #2a1f57; }
  tr.now td { color:var(--click); }
  .muted { color:var(--dim); }
  canvas.marking { cursor:crosshair; }
  tr.done td { color:var(--dim); text-decoration:line-through; }
  #views.split { display:grid; grid-template-columns:1fr 1fr; }
  #views.split canvas, #views.split #cmpImg { height:auto; aspect-ratio:16/9; }
  #cmp { background:#000; display:flex; flex-direction:column; }
  #cmp[hidden] { display:none; }
  .cmpbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:4px 6px; background:var(--panel); }
  .cmpbar input { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:4px; }
  #cmpImg { width:100%; height:min(60vh, 460px); object-fit:contain; object-position:center top; }
  @media (max-width: 700px) { #views.split { grid-template-columns:1fr; } }
  #drop { position:absolute; inset:0; display:none; place-items:center; background:rgba(11,6,32,.85); font-size:18px; border:2px dashed var(--cube); }
</style>
</head>
<body>
<header>
  <h1>GD LEVEL VIEWER</h1>
  <select id="pick"></select>
  <button id="refresh" title="get the newest version of the sessions' levels">⟳ refresh</button>
  <button id="linkBtn" title="copy a link to this level at this moment">🔗 link</button>
  <label class="btn">open .gdlvl<input id="file" type="file" accept=".gdlvl,.txt" hidden></label>
  <button id="play">▶ play</button>
  <button id="restart">⟲</button>
  <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
  <button id="lookBtn" class="on" title="colours, triggers, block skins as in the game (off: the schematic view)">game look</button>
  <button id="artBtn" title="draw objects, background, ground and icon with GD's own sprites from your game install (needs tools/serve.js; VISUALS.md)">GD art</button>
  <button id="mapBtn" title="the whole level as one picture with its path (make it with node tools/levelmap.js <level>)">level map</button>
  <button id="hit">hitboxes</button>
  <button id="cmpBtn" hidden title="a frame of your recording next to the replay (needs tools/serve.js)">compare</button>
  <button id="markBtn" title="pause, then click where something should change (key M)">✎ mark</button>
  <button id="sound" class="on">click sound</button>
  <button id="music" class="on">music</button>
  <button id="beatsBtn" class="on" title="beat grid of the level's song (songs on this PC, from tools/beats.js)">beats</button>
  <span id="clock" class="muted"></span>
</header>
<div id="views"><div id="wrap"><canvas id="cv"></canvas><div id="drop">drop a .gdlvl here</div></div>
<div id="cmp" hidden><div class="cmpbar"><select id="cmpRec"></select>
  <label title="where this level's attempt starts in the video: replay time t shows video second (start + t)">level starts at <input id="cmpT0" type="number" step="0.1" value="0" style="width:5em"> s</label>
  <button data-dt="-1">-1 s</button><button data-dt="-0.1">-0.1</button><button data-dt="0.1">+0.1</button><button data-dt="1">+1 s</button>
  <button id="cmpShot" title="replay + game frame as one PNG in local/shots/">save comparison</button>
  <span id="cmpAt" class="muted"></span></div><img id="cmpImg" alt="game frame"></div></div>
<canvas id="strip"></canvas>
<input id="scrub" type="range" min="0" max="1000" value="0">
<main>
  <div class="card"><h2>Level</h2><div id="summary"></div></div>
  <div class="card"><h2>Clicks</h2><div id="clicks"></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Marks — what to change</h2><div id="marks"></div></div>
</main>
<script src="../lib/gd.js"></script>
<script src="../lib/objects_extra.js"></script>
<script src="../lib/objects_gd22.js"></script>
<script src="../lib/objects.js"></script>
<script src="../lib/physics.js"></script>
<script src="../lib/sync.js"></script>
<script src="../lib/look.js"></script>
<script src="../lib/vfx.js"></script>
<script src="../lib/objects_art.js"></script>
<script src="../lib/objects_frames.js"></script>
<script src="../lib/art.js"></script>
<script src="../lib/natural.js"></script>
<script src="../lib/difficulty.js"></script>
<script src="../lib/windows.js"></script>
<script src="levels.js"></script>
<script src="levels.local.js" onerror="window.GD_LEVELS_LOCAL = []"></script>
<script src="beats.local.js" onerror="window.GD_BEATS = {}"></script>
<script>
"use strict";
const P = GD.PHYS;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
// shoot mode (tools/shoot.js): ?shoot=<job> renders a level's frames headless, without the overlays
const SHOOT = new URLSearchParams(location.search).get("shoot");
let MAPCAM = null; // level map (tools/levelmap.js): a fixed camera {x, y, scale, groundY}, no player
let L = null;          // {name, objects, world, sol, path}
let t = 0, playing = false, speed = 1, showHit = false, sound = true, lastTick = -1;

// ---------- loading ----------
async function gunzipB64(b64) {
  const bytes = GD.b64urlToBytes(b64);
  const ds = new DecompressionStream("gzip");
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(buf);
}
let song = null, songInfo = null, music = true;
function setSong(info) {
  if (song) { song.pause(); song = null; }
  songInfo = info || null;
  if (!info || location.protocol === "file:") return; // songs come from tools/serve.js
  song = new Audio(info.url); song.preload = "auto";
  song.onerror = () => { song = null; };
}
// keep the song where the replay is: level time t plays song second offset + t
function syncSong(force) {
  if (!song) return;
  if (!playing || !music) { if (!song.paused) song.pause(); return; }
  const want = songInfo.offset + t;
  song.playbackRate = speed;
  if (force || Math.abs(song.currentTime - want) > 0.08) song.currentTime = want;
  if (song.paused) song.play().catch(() => {});
}
function load(name, levelStr, saved, info) {
  setSong(info);
  const level = GD.parseLevel(levelStr);
  const world = GD.makeWorld(level.objects, level.header);
  let sol;
  if (saved) sol = saved.ok ? { ok: true, events: saved.events, clicks: [] } : { ok: false, trail: saved.events, clicks: [], dieAt: { x: saved.dieX || 0, tick: 0 }, why: saved.why || "" };
  else try { sol = GD.solveAny(world); } catch (e) { sol = { ok: false, clicks: [], trail: [], dieAt: GD.startState(world), why: e.message }; }
  // the replay shows a natural way to play it (lib/natural.js: a tap per jump, no empty jumps, the
  // ship and wave flown along the middle of their corridor), not the solver's fewest-presses run
  // ("the path is unnatural ... empty clicks ... the ship looks like a wave", playtest). The
  // "solver run" button shows the solver's own. Timing windows in the table stay the solver's.
  if (sol.ok && !saved && GD.naturalPlan && !window.SOLVER_RUN) {
    try {
      const n = GD.naturalPlan(world, sol, level.objects);
      if (n && n.path[n.path.length - 1].done) {
        const ms = sol.clicks.filter(c => c.type === "press").map(c => c.ms);
        sol = Object.assign({}, sol, { events: n.events, natural: true,
          clicks: n.events.map(e => ({ type: e.type, tick: e.tick, lo: e.tick, hi: e.tick, ms: 0 })) });
      }
    } catch (e) { console.warn("natural plan failed:", e); }
  }
  // a level that cannot be beaten replays the run that got furthest
  let events = sol.events;
  if (!sol.ok) {
    events = [];
    (sol.trail || []).forEach((e, i, a) => { events.push(e); if (e.type === "press" && !(a[i + 1] && a[i + 1].type === "release")) events.push({ tick: e.tick + 1, type: "release" }); });
    sol.clicks = (sol.trail || []).filter(e => e.type === "press").map(e => ({ type: "press", tick: e.tick, lo: e.tick, hi: e.tick, ms: 0, act: "" }));
  }
  const path = GD.run(world, events).path;
  if (saved && saved.ok) sol.clicks = saved.events.map(e => ({ type: e.type, tick: e.tick, lo: e.tick, hi: e.tick, ms: 0 }));
  sol.clicks.forEach(c => { if (c.type === "press") c.act = path[Math.min(c.tick + 1, path.length - 1)].act || c.act; c.x = path[Math.min(c.tick, path.length - 1)].x; });
  // button state at every step, for the hold strip and the button light
  const held = new Uint8Array(path.length);
  { const ev = (events || []).slice().sort((a, b) => a.tick - b.tick); let h = 0, j = 0;
    for (let k = 0; k < path.length; k++) { while (j < ev.length && ev[j].tick <= k) { h = ev[j].type === "press" ? 1 : 0; j++; } held[k] = h; } }
  L = { name, level, world, sol, path, held };
  L.vrot = visualRot(path);
  // colour / alpha / zoom triggers fire when the replayed run passes their x
  L.look = GD.LOOK.timeline(level, x => {
    let lo = 0, hi = path.length - 1;
    if (path[hi].x < x) return Infinity;
    while (lo < hi) { const m = (lo + hi) >> 1; if (path[m].x >= x) hi = m; else lo = m + 1; }
    return lo / P.TPS;
  });
  // the song's beat grid, when tools/beats.js has analysed it on this PC
  const grid = info && (window.GD_BEATS || {})[info.url];
  L.beats = grid ? { grid, offset: info.offset || 0, tl: GD.SYNC.timeline(world) } : null;
  t = 0; lastTick = -1; playing = false; setPlay();
  summary(); clickTable(); markTable(); if (cmpOn) cmpLoadSetting(); draw();
  windowsLater(L, events);
}
// every input's whole timing window (lib/windows.js: a player's window, later inputs re-planned), worked out after
// the level shows, a slice at a time so the page stays live; the button strip shades each one and the
// click table lists it. Saved and natural replays come without windows (the user: show how much room
// there is, not only the chosen moment, which often sits near an edge).
function windowsLater(LL, events) {
  if (window.SHOOT_MAP || !GD.inputWindows || !LL.sol.ok || !events || !events.length || LL.sol.clicks.some(c => c.hi > c.lo)) return;
  const byKey = new Map(LL.sol.clicks.map(c => [c.type + c.tick, c])), sorted = events.slice().sort((a, b) => a.tick - b.tick);
  const take = wins => { for (const wv of wins) { const c = byKey.get(wv.type + wv.tick); if (!c || c.ms) continue;
    Object.assign(c, { lo: wv.lo, hi: wv.hi, ms: Math.round((wv.hi - wv.lo + 1) / P.TPS * 1000) });
    if (wv.j >= 0) { const e = sorted[wv.j], rc = e && byKey.get(e.type + e.tick); if (rc) rc.tapOf = c; } } };
  const finish = () => { LL.windowsDone = true; summary(); clickTable(); draw(); };
  if (SHOOT) { take(GD.inputWindows(LL.world, events, LL.path, {})); return finish(); } // shots: all at once
  // a Web Worker (one input can take seconds; on the page that froze it), else slices on the page (file://)
  if (windowsLater.worker) windowsLater.worker.terminate();
  const libs = [...document.scripts].map(s => s.src).filter(u => /\/lib\/(gd|objects_extra|objects_gd22|objects|physics|difficulty|windows)\.js(\?.*)?$/.test(u));
  let wk = null; try { if (location.protocol.startsWith("http")) wk = new Worker("windows_worker.js"); } catch (e) {}
  if (wk) {
    windowsLater.worker = wk;
    wk.onmessage = e => {
      if (L !== LL) { wk.terminate(); return; } // another level was loaded
      if (e.data.wins) { take(e.data.wins); if (!playing) draw(); }
      if (e.data.done) { wk.terminate(); finish(); }
      if (e.data.error) { console.warn("timing windows:", e.data.error); wk.terminate(); }
    };
    wk.postMessage({ libs, objects: LL.level.objects, header: LL.level.header, events: sorted });
    return;
  }
  let from = 0;
  const slice = () => {
    if (L !== LL) return; // another level was loaded
    const r = GD.inputWindows(LL.world, events, LL.path, { from, out: [], budget: 40 });
    take(r);
    if (r.next === null) return finish();
    from = r.next; if (!playing) draw(); setTimeout(slice, 0);
  };
  setTimeout(slice, 50);
}
async function loadFile(f) {
  const rec = GD.parseRecord(await gunzipB64(await f.text()));
  load(GD.getField(rec, "k2") || f.name, await gunzipB64(GD.getField(rec, "k4")));
}
const pick = document.getElementById("pick");
const ALL = (window.GD_LEVELS || []).concat(window.GD_LEVELS_LOCAL || []);
ALL.forEach((l, i) => pick.add(new Option(l.name + "  —  " + l.file, i)));
pick.onchange = () => { const l = ALL[pick.value]; load(l.name, l.level, l.solution, l.song); L.deaths = l.deaths || []; summary(); draw(); };
document.getElementById("file").onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
const drop = document.getElementById("drop");
addEventListener("dragover", e => { e.preventDefault(); drop.style.display = "grid"; });
addEventListener("dragleave", e => { if (!e.relatedTarget) drop.style.display = "none"; });
addEventListener("drop", e => { e.preventDefault(); drop.style.display = "none"; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---------- panels ----------
function summary() {
  const counts = {};
  let deco = 0;
  for (const o of L.level.objects) { const d = GD.objInfo(o.id); if (d.kind === "decoration" || d.kind === "trigger") { deco++; continue; } counts[d.name] = (counts[d.name] || 0) + 1; }
  const unsim = L.level.objects.filter(o => ["unknown", "unsupported"].includes(GD.objInfo(o.id).kind)).length;
  const s = L.sol;
  let h = `<b>${esc(L.name)}</b><br><span class="muted">${L.level.objects.length} objects · ${(L.world.endX / 30).toFixed(0)} blocks · ${(L.world.endX / P.SPEED).toFixed(1)} s at 1×</span><br>`;
  // presses only (a saved solution lists releases too); windows only where known (saved ones have none)
  const nP = s.clicks.filter(c => c.type !== "release").length, ws = s.clicks.map(c => c.ms).filter(ms => ms > 0);
  h += s.ok ? `<p class="ok">Beatable in ${nP} click${nP === 1 ? "" : "s"}` +
              (ws.length ? ` · tightest window ${Math.min(...ws)} ms` : "") + `</p>`
            : `<p class="bad">Not beatable in the simulation. The furthest run dies at block ${(s.dieAt.x / 30).toFixed(1)} (${(s.dieAt.tick / P.TPS).toFixed(2)} s): ${s.why}. The replay shows that furthest run.</p>`;
  if (L.deaths && L.deaths.length) h += `<p class="bad">Your real deaths (normal mode, from recordings): ${L.deaths.length} at ${L.deaths.slice().sort((a, b) => a - b).map(p => p.toFixed(0) + "%").join(", ")} (red marks).</p>`;
  if (unsim) h += `<p class="muted">${unsim} objects are not simulated yet (unsupported portals or unknown ids).</p>`;
  if (deco) h += `<p class="muted">${deco} decoration and trigger objects (no physics).</p>`;
  if (L.beats) { const g = L.beats.grid; h += `<p class="muted">song ${g.bpm.toFixed(1)} BPM (${g.conf} confidence) · level starts at song ${L.beats.offset} s · beat 1 = first beat after the start</p>`; }
  else if (songInfo) h += `<p class="muted">no beat grid for this song (run <code>node tools/beats.js</code>; the song must be on this PC)</p>`;
  h += `<p class="muted">` + Object.entries(Object.fromEntries(Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 14))).map(([k, v]) => `${esc(k)} ×${v}`).join(" · ") + `</p>`;
  document.getElementById("summary").innerHTML = h;
}
function clickTable() {
  const el = document.getElementById("clicks");
  if (!L.sol.clicks.length) { el.innerHTML = `<span class="muted">none</span>`; return; }
  const bt = c => L.beats ? `<td>${beatOf(c.tick / P.TPS).toFixed(2)}</td>` : "";
  el.innerHTML = `<table><tr><th>#</th><th>time</th>${L.beats ? "<th>beat</th>" : ""}<th>block</th><th>what</th><th>window</th></tr>` +
    L.sol.clicks.map((c, i) => `<tr id="c${i}"><td>${i + 1}</td><td>${(c.tick / P.TPS).toFixed(3)} s</td>${bt(c)}<td>${(c.x / 30).toFixed(1)}</td><td>${c.type === "release" ? "release" : esc(c.act || "press")}</td><td>${c.ms ? c.ms + " ms" : ""}</td></tr>`).join("") + `</table>`;
}
function beatOf(t) { return GD.SYNC.timeToBeat(L.beats.grid, L.beats.offset, t); }
function timeOfBeat(b) { return GD.SYNC.beatToTime(L.beats.grid, L.beats.offset, b); }
// level beat b starts a bar when its song beat index is the grid's downbeat, mod 4
function isDownbeat(b) { const g = L.beats.grid, k = Math.round((timeOfBeat(b) + L.beats.offset - g.t0) / g.period); return ((k - g.downbeat) % 4 + 4) % 4 === 0; }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

// ---------- controls ----------
const playBtn = document.getElementById("play");
function setPlay() { playBtn.textContent = playing ? "❚❚ pause" : "▶ play"; }
playBtn.onclick = () => { if (!L) return; if (tick() >= L.path.length - 1) t = 0; playing = !playing; setPlay(); syncSong(true); };
document.getElementById("restart").onclick = () => { if (!L) return; t = 0; lastTick = -1; playing = true; setPlay(); syncSong(true); };
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); syncSong(true);
});
let look = true;
try { look = localStorage.getItem("gdlm.look") !== "0"; } catch (e) {}
document.getElementById("lookBtn").classList.toggle("on", look);
document.getElementById("lookBtn").onclick = e => { look = !look; e.target.classList.toggle("on", look); try { localStorage.setItem("gdlm.look", look ? "1" : "0"); } catch (err) {} draw(); };
// GD's own sprites (lib/art.js), loaded from the game install through tools/serve.js; off on file:// and
// on the phone page, which must not carry RobTop's art
let art = false, artTried = null;
const artBtn = document.getElementById("artBtn");
try { art = localStorage.getItem("gdlm.art") !== "0"; } catch (e) {}
function artLoad() { return artTried || (artTried = artLoad1()); } // one load, shared by every caller
async function artLoad1() {
  if (!location.protocol.startsWith("http") || window.GD_PHONE) { art = false; artBtn.hidden = true; return; }
  artBtn.textContent = "GD art …";
  const ok = await GD.ART_LIB.load("/gdres/", () => draw());
  artBtn.textContent = ok ? "GD art" : "GD art (not found)";
  artBtn.title = ok ? artBtn.title : "no sprites: " + GD.ART_LIB.S.failed + " (set GD_GAME for tools/serve.js)";
  if (!ok) art = false;
  artBtn.classList.toggle("on", art); draw();
}
artBtn.classList.toggle("on", art);
artBtn.onclick = () => { art = !art; artBtn.classList.toggle("on", art); try { localStorage.setItem("gdlm.art", art ? "1" : "0"); } catch (e) {} if (art) artLoad(); draw(); };
if (art) artLoad();
const artOn = () => art && LS && GD.ART_LIB && GD.ART_LIB.S.ready;
// level map: local/maps/<level file name>.jpg, made by tools/levelmap.js (GD art: this PC only)
if (document.getElementById("mapBtn")) document.getElementById("mapBtn").onclick = async () => {
  const l = ALL[pick.value]; if (!l) return;
  const name = String(l.file || "").split("/").pop().replace(/\.(gdlvl|json)$/, ""), url = "../local/maps/" + name + ".jpg";
  let ok = false; try { ok = (await fetch(url, { method: "HEAD", cache: "no-store" })).ok; } catch (e) {}
  if (ok) window.open(url, "_blank"); else alert("No map yet for " + name + ". Make it with:\n  node tools/levelmap.js " + l.file);
};
document.getElementById("hit").onclick = e => { showHit = !showHit; e.target.classList.toggle("on", showHit); draw(); };
document.getElementById("sound").onclick = e => { sound = !sound; e.target.classList.toggle("on", sound); };
document.getElementById("music").onclick = e => { music = !music; e.target.classList.toggle("on", music); syncSong(true); };
let showBeats = true;
document.getElementById("beatsBtn").onclick = e => { showBeats = !showBeats; e.target.classList.toggle("on", showBeats); draw(); };
const scrub = document.getElementById("scrub");
scrub.oninput = () => { t = scrub.value / 1000 * (L.path.length - 1) / P.TPS; lastTick = tick(); playing = false; setPlay(); syncSong(); draw(); };
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playBtn.onclick(); }
  if (e.key === "r") document.getElementById("restart").onclick();
  if (e.key === "ArrowRight") { t += 1 / P.TPS * (e.shiftKey ? 24 : 1); playing = false; setPlay(); draw(); }
  if (e.key === "ArrowLeft") { t = Math.max(0, t - 1 / P.TPS * (e.shiftKey ? 24 : 1)); playing = false; setPlay(); draw(); }
});

let actx = null;
function beep() {
  if (!sound) return;
  actx = actx || new AudioContext();
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = 1320;
  g.gain.setValueAtTime(0.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.06);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.07);
}

}
// ---------- level map (tools/levelmap.js): the whole level in stacked rows, drawn in chunks with a fixed
// camera -- each chunk at the moment the player passes it, so colour changes and moved objects are where
// they are then -- and the replayed path over it: mode colours, presses, releases, orb / pad hits,
// portals, seconds and % ticks, section names, where a run the sim cannot finish stops ----------
const MODE_COL = { cube: "#7dff00", ship: "#ff5ad2", wave: "#00e5ff", ball: "#ffa500", ufo: "#ffe14d", robot: "#c8c8ff", spider: "#b48cff", swing: "#ffffff" };

  let minY = 0, maxY = 120;

  for (const p of path) if (p.y > maxY) maxY = p.y;

  const rows = job.rows || Math.max(1, Math.ceil(endX * S / 2400)), rowU = Math.ceil(endX / rows / 30) * 30;
  const GROUND = 45, camY0 = Math.min(0, minY);

  const out = document.createElement("canvas"); out.width = rowW + 20; out.height = HEAD + rows * (rowH + GAP);
  const X = out.getContext("2d"); X.fillStyle = "#0d0b18"; X.fillRect(0, 0, out.width, out.height);
  // the scene, chunk by chunk
  const CH = 600;
  const timeAtX = x => { let lo = 0, hi = path.length - 1; if (path[hi].x < x) return hi / P.TPS; while (lo < hi) { const m = (lo + hi) >> 1; if (path[m].x >= x) hi = m; else lo = m + 1; } return lo / P.TPS; };
  W = cv.width = Math.round(CH * S); H = cv.height = sceneH;
  let first = true;
  for (let r = 0; r < rows; r++) for (let a = r * rowU; a < (r + 1) * rowU && a < endX; a += CH) {
    MAPCAM = { x: a, y: camY0, scale: S, groundY: H - GROUND * S };
    t = timeAtX(a + CH / 2); playing = false;
    for (let k = 0; k < (first ? 6 : 2); k++) { draw(); await new Promise(res => setTimeout(res, first ? 150 : 20)); }
    first = false;
    const w = Math.min(CH, (r + 1) * rowU - a);
    X.drawImage(cv, 0, 0, Math.round(w * S), H, 10 + Math.round((a - r * rowU) * S), HEAD + r * (rowH + GAP) + TOP, Math.round(w * S), H);
  }
  MAPCAM = null;
  // overlay: level x, y -> map pixels
  const rowOf = x => Math.min(rows - 1, Math.max(0, Math.floor(x / rowU)));
  const mx = x => 10 + (x - rowOf(x) * rowU) * S, my = (x, y) => HEAD + rowOf(x) * (rowH + GAP) + TOP + (sceneH - GROUND * S) - (y - camY0) * S;
  X.lineJoin = "round"; X.lineCap = "round";
  const ok = L.sol.ok, stopK = path.findIndex(p => p.dead || p.ghost);
  const lastK = stopK >= 0 ? stopK : path.length - 1;
  // the path, outlined, coloured by mode; a new stroke at each row and mode change
  for (const [lw, colOf] of [[6, () => "rgba(0,0,0,.75)"], [3, m => MODE_COL[m] || "#fff"]]) {
    let k = 0;
    while (k < lastK) {

      X.strokeStyle = colOf(m); X.lineWidth = lw; X.beginPath(); X.moveTo(mx(path[k].x), my(path[k].x, path[k].y));
      while (k < lastK && path[k].mode === m && rowOf(path[k].x) === r) { k += 2; const p = path[Math.min(k, lastK)]; if (rowOf(p.x) === r) X.lineTo(mx(p.x), my(p.x, p.y)); }

    }

  X.font = "bold 12px system-ui"; X.textAlign = "center";

    .replace(/ portal$/, "").replace(/^normal size$/, "big").replace(/ speed$/, "");
  const lastEnd = [];
  const portals = L.level.objects.filter(o => /^(mode|gravity|speed|size|teleport)$/.test(GD.objInfo(o.id).kind)).sort((a, b) => a.x - b.x);
  for (const o of portals) {
    const d = GD.objInfo(o.id), r = rowOf(o.x), x = mx(o.x), y0 = HEAD + r * (rowH + GAP), label = short(d.name), w = X.measureText(label).width;
    X.strokeStyle = "rgba(255,255,255,.35)"; X.lineWidth = 1; X.setLineDash([4, 4]); X.beginPath(); X.moveTo(x, y0 + TOP); X.lineTo(x, y0 + TOP + sceneH); X.stroke(); X.setLineDash([]);
    let lane = 0; while (lane < 3 && lastEnd[r * 3 + lane] !== undefined && lastEnd[r * 3 + lane] > x - w / 2 - 4) lane++;
    if (lane === 3) continue; // too crowded: the dashed line stays
    lastEnd[r * 3 + lane] = x + w / 2;
    X.fillStyle = d.color || "#fff"; X.fillText(label, x, y0 + 11 + lane * 12);
  }
  // section names
  X.font = "bold 15px system-ui"; X.textAlign = "left";
  for (const sc of job.sections || []) { const x = sc.from * 30, r = rowOf(x); X.fillStyle = "#9fd"; X.fillText("▸ " + sc.name, mx(x) + 3, HEAD + r * (rowH + GAP) + TOP + 16); }
  // seconds and % ticks under each row
  X.font = "11px system-ui"; X.textAlign = "center";
  const total = lastK / P.TPS;
  for (let sec = 0; sec <= total; sec++) {
    const k = Math.min(path.length - 1, sec * P.TPS), x = path[k].x; if (x > endX) break;
    const yb = HEAD + rowOf(x) * (rowH + GAP) + TOP + sceneH;
    X.fillStyle = "#bbb"; X.fillRect(mx(x), yb, 1, 6); X.fillText(sec + "s", mx(x), yb + 16);
  }
  for (let pc = 10; pc < 100; pc += 10) {
    const x = pc / 100 * (L.world.endX - 90), yb = HEAD + rowOf(x) * (rowH + GAP) + TOP + sceneH;
    X.fillStyle = "#ffe14d"; X.fillRect(mx(x), yb, 2, 10); X.fillText(pc + "%", mx(x), yb + 29);
  }
  // where a run the sim cannot finish stops
  if (!ok || stopK >= 0) {
    const p = path[lastK], cx = mx(p.x), cy = my(p.x, p.y);
    X.strokeStyle = "#ff3b6b"; X.lineWidth = 4; X.beginPath(); X.moveTo(cx - 9, cy - 9); X.lineTo(cx + 9, cy + 9); X.moveTo(cx + 9, cy - 9); X.lineTo(cx - 9, cy + 9); X.stroke();
    // the label on a dark plate: red text vanished on red sections (Deadlocked's 59% stop)
    const msg = `the simulation stops here (${(p.x / (L.world.endX - 90) * 100).toFixed(0)}%): ${p.why || L.sol.why || "dies"}`;
    X.font = "bold 15px system-ui"; X.textAlign = "left";
    const tw = X.measureText(msg).width, tx = Math.max(10, Math.min(cx + 12, out.width - tw - 14)), ty = Math.max(HEAD + 14, cy - 14);
    X.fillStyle = "rgba(10,10,18,.82)"; X.fillRect(tx - 5, ty - 15, tw + 10, 21);
    X.fillStyle = "#ff5c82"; X.fillText(msg, tx, ty);
  }
  // header: name, numbers, legend
  X.textAlign = "left"; X.fillStyle = "#fff"; X.font = "bold 22px system-ui"; X.fillText(L.name, 12, 28);
  let presses = 0; for (let k = 1; k <= lastK; k++) if (L.held[k] && !L.held[k - 1]) presses++;
  X.font = "14px system-ui"; X.fillStyle = "#bbb";
  X.fillText(`${(L.world.endX / 30).toFixed(0)} blocks · ${total.toFixed(1)} s · ${presses} presses · ${ok ? (L.sol.natural ? "natural replay" : "solver run") : "not beaten in the simulation"} · ${job.art === false ? "shapes" : "GD art"}`, 12, 52);
  let lx = Math.max(640, Math.min(out.width - 560, 900));
  X.font = "13px system-ui";
  for (const [m, c] of Object.entries(MODE_COL)) {
    if (!path.some(p => p.mode === m)) continue;
    X.fillStyle = c; X.fillRect(lx, 40, 18, 4); X.fillStyle = "#ddd"; X.fillText(m, lx + 22, 46); lx += 30 + X.measureText(m).width;
  }
  X.fillStyle = "#fff"; X.beginPath(); X.arc(lx + 6, 42, 5, 0, 7); X.fill(); X.fillStyle = "#ddd"; X.fillText("press", lx + 15, 46); lx += 62;
  X.strokeStyle = "#fff"; X.lineWidth = 2; X.strokeRect(lx, 38, 8, 8); X.fillText("release", lx + 13, 46); lx += 70;
  X.fillStyle = "#ffe14d"; X.fillText("◆ orb / pad", lx, 46);
  return out.toDataURL("image/png");
}

  timeOfX(x) { if (!L) return 0; const i = L.path.findIndex(s => s.x >= x); return (i < 0 ? L.path.length - 1 : i) / P.TPS; },
  get t() { return t; }, get len() { return L ? (L.path.length - 1) / P.TPS : 0 },
