<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD Level Viewer</title>
<style>
  :root { --bg:#0b0620; --panel:#160d33; --ink:#e8e4ff; --dim:#8b84b8; --block:#3d7bff; --spike:#ff3b6b; --cube:#3dffb0; --click:#ffe14d; --win:rgba(255,225,77,.13); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; background:var(--panel); }
  header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.04em; color:var(--cube); }
  select, button, label.btn { background:#24184f; color:var(--ink); border:1px solid #3b2d78; border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button.on { background:#3b2d78; border-color:var(--cube); }
  #wrap { position:relative; }
  canvas { display:block; width:100%; height:min(60vh, 460px); background:#0e0828; touch-action:none; }
  #scrub { width:100%; margin:0; accent-color:var(--cube); }
  #strip { display:block; width:100%; height:34px; background:#120a2e; cursor:pointer; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:16px; padding:12px 16px 24px; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .ok { color:var(--cube); } .bad { color:var(--spike); }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid #2a1f57; }
  tr.now td { color:var(--click); }
  .muted { color:var(--dim); }
  #drop { position:absolute; inset:0; display:none; place-items:center; background:rgba(11,6,32,.85); font-size:18px; border:2px dashed var(--cube); }
</style>
</head>
<body>
<header>
  <h1>GD LEVEL VIEWER</h1>
  <select id="pick"></select>
  <label class="btn">open .gdlvl<input id="file" type="file" accept=".gdlvl,.txt" hidden></label>
  <button id="play">▶ play</button>
  <button id="restart">⟲</button>
  <button data-speed="0.25">¼×</button><button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button>
  <button id="hit">hitboxes</button>
  <button id="sound" class="on">click sound</button>
  <button id="music" class="on">music</button>
  <button id="beatsBtn" class="on" title="beat grid of the level's song (songs on this PC, from tools/beats.js)">beats</button>
  <span id="clock" class="muted"></span>
</header>
<div id="wrap"><canvas id="cv"></canvas><div id="drop">drop a .gdlvl here</div></div>
<canvas id="strip"></canvas>
<input id="scrub" type="range" min="0" max="1000" value="0">
<main>
  <div class="card"><h2>Level</h2><div id="summary"></div></div>
  <div class="card"><h2>Clicks</h2><div id="clicks"></div></div>
</main>
<script src="../lib/gd.js"></script>
<script src="../lib/objects_extra.js"></script>
<script src="../lib/objects_gd22.js"></script>
<script src="../lib/objects.js"></script>
<script src="../lib/physics.js"></script>
<script src="../lib/sync.js"></script>
<script src="levels.js"></script>
<script src="levels.local.js" onerror="window.GD_LEVELS_LOCAL = []"></script>
<script src="beats.local.js" onerror="window.GD_BEATS = {}"></script>
<script>
"use strict";
const P = GD.PHYS;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let L = null;          // {name, objects, world, sol, path}
let t = 0, playing = false, speed = 1, showHit = false, sound = true, lastTick = -1;

// ---------- loading ----------
async function gunzipB64(b64) {
  const bytes = GD.b64urlToBytes(b64);
  const ds = new DecompressionStream("gzip");
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(buf);
}
let song = null, songInfo = null, music = true;
function setSong(info) {
  if (song) { song.pause(); song = null; }
  songInfo = info || null;
  if (!info || location.protocol === "file:") return; // songs come from tools/serve.js
  song = new Audio(info.url); song.preload = "auto";
  song.onerror = () => { song = null; };
}
// keep the song where the replay is: level time t plays song second offset + t
function syncSong(force) {
  if (!song) return;
  if (!playing || !music) { if (!song.paused) song.pause(); return; }
  const want = songInfo.offset + t;
  song.playbackRate = speed;
  if (force || Math.abs(song.currentTime - want) > 0.08) song.currentTime = want;
  if (song.paused) song.play().catch(() => {});
}
function load(name, levelStr, saved, info) {
  setSong(info);
  const level = GD.parseLevel(levelStr);
  const world = GD.makeWorld(level.objects, level.header);
  let sol;
  if (saved) sol = saved.ok ? { ok: true, events: saved.events, clicks: [] } : { ok: false, trail: saved.events, clicks: [], dieAt: { x: saved.dieX || 0, tick: 0 }, why: saved.why || "" };
  else try { sol = GD.solveAny(world); } catch (e) { sol = { ok: false, clicks: [], trail: [], dieAt: GD.startState(world), why: e.message }; }
  // a level that cannot be beaten replays the run that got furthest
  let events = sol.events;
  if (!sol.ok) {
    events = [];
    (sol.trail || []).forEach((e, i, a) => { events.push(e); if (e.type === "press" && !(a[i + 1] && a[i + 1].type === "release")) events.push({ tick: e.tick + 1, type: "release" }); });
    sol.clicks = (sol.trail || []).filter(e => e.type === "press").map(e => ({ type: "press", tick: e.tick, lo: e.tick, hi: e.tick, ms: 0, act: "" }));
  }
  const path = GD.run(world, events).path;
  if (saved && saved.ok) sol.clicks = saved.events.map(e => ({ type: e.type, tick: e.tick, lo: e.tick, hi: e.tick, ms: 0 }));
  sol.clicks.forEach(c => { if (c.type === "press") c.act = path[Math.min(c.tick + 1, path.length - 1)].act || c.act; c.x = path[Math.min(c.tick, path.length - 1)].x; });
  // button state at every step, for the hold strip and the button light
  const held = new Uint8Array(path.length);
  { const ev = (events || []).slice().sort((a, b) => a.tick - b.tick); let h = 0, j = 0;
    for (let k = 0; k < path.length; k++) { while (j < ev.length && ev[j].tick <= k) { h = ev[j].type === "press" ? 1 : 0; j++; } held[k] = h; } }
  L = { name, level, world, sol, path, held };
  // the song's beat grid, when tools/beats.js has analysed it on this PC
  const grid = info && (window.GD_BEATS || {})[info.url];
  L.beats = grid ? { grid, offset: info.offset || 0, tl: GD.SYNC.timeline(world) } : null;
  t = 0; lastTick = -1; playing = false; setPlay();
  summary(); clickTable(); draw();
}
async function loadFile(f) {
  const rec = GD.parseRecord(await gunzipB64(await f.text()));
  load(GD.getField(rec, "k2") || f.name, await gunzipB64(GD.getField(rec, "k4")));
}
const pick = document.getElementById("pick");
const ALL = (window.GD_LEVELS || []).concat(window.GD_LEVELS_LOCAL || []);
ALL.forEach((l, i) => pick.add(new Option(l.name + "  —  " + l.file, i)));
pick.onchange = () => { const l = ALL[pick.value]; load(l.name, l.level, l.solution, l.song); L.deaths = l.deaths || []; summary(); draw(); };
document.getElementById("file").onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
const drop = document.getElementById("drop");
addEventListener("dragover", e => { e.preventDefault(); drop.style.display = "grid"; });
addEventListener("dragleave", e => { if (!e.relatedTarget) drop.style.display = "none"; });
addEventListener("drop", e => { e.preventDefault(); drop.style.display = "none"; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// ---------- panels ----------
function summary() {
  const counts = {};
  let deco = 0;
  for (const o of L.level.objects) { const d = GD.objInfo(o.id); if (d.kind === "decoration" || d.kind === "trigger") { deco++; continue; } counts[d.name] = (counts[d.name] || 0) + 1; }
  const unsim = L.level.objects.filter(o => ["unknown", "unsupported"].includes(GD.objInfo(o.id).kind)).length;
  const s = L.sol;
  let h = `<b>${esc(L.name)}</b><br><span class="muted">${L.level.objects.length} objects · ${(L.world.endX / 30).toFixed(0)} blocks · ${(L.world.endX / P.SPEED).toFixed(1)} s at 1×</span><br>`;
  h += s.ok ? `<p class="ok">Beatable in ${s.clicks.length} click${s.clicks.length === 1 ? "" : "s"}` +
              (s.clicks.length ? ` · tightest window ${Math.min(...s.clicks.map(c => c.ms))} ms` : "") + `</p>`
            : `<p class="bad">Not beatable in the simulation. The furthest run dies at block ${(s.dieAt.x / 30).toFixed(1)} (${(s.dieAt.tick / P.TPS).toFixed(2)} s): ${s.why}. The replay shows that furthest run.</p>`;
  if (L.deaths && L.deaths.length) h += `<p class="bad">Your real deaths (normal mode, from recordings): ${L.deaths.length} at ${L.deaths.slice().sort((a, b) => a - b).map(p => p.toFixed(0) + "%").join(", ")} (red marks).</p>`;
  if (unsim) h += `<p class="muted">${unsim} objects are not simulated yet (unsupported portals or unknown ids).</p>`;
  if (deco) h += `<p class="muted">${deco} decoration and trigger objects (no physics).</p>`;
  if (L.beats) { const g = L.beats.grid; h += `<p class="muted">song ${g.bpm.toFixed(1)} BPM (${g.conf} confidence) · level starts at song ${L.beats.offset} s · beat 1 = first beat after the start</p>`; }
  else if (songInfo) h += `<p class="muted">no beat grid for this song (run <code>node tools/beats.js</code>; the song must be on this PC)</p>`;
  h += `<p class="muted">` + Object.entries(Object.fromEntries(Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 14))).map(([k, v]) => `${esc(k)} ×${v}`).join(" · ") + `</p>`;
  document.getElementById("summary").innerHTML = h;
}
function clickTable() {
  const el = document.getElementById("clicks");
  if (!L.sol.clicks.length) { el.innerHTML = `<span class="muted">none</span>`; return; }
  const bt = c => L.beats ? `<td>${beatOf(c.tick / P.TPS).toFixed(2)}</td>` : "";
  el.innerHTML = `<table><tr><th>#</th><th>time</th>${L.beats ? "<th>beat</th>" : ""}<th>block</th><th>what</th><th>window</th></tr>` +
    L.sol.clicks.map((c, i) => `<tr id="c${i}"><td>${i + 1}</td><td>${(c.tick / P.TPS).toFixed(3)} s</td>${bt(c)}<td>${(c.x / 30).toFixed(1)}</td><td>${c.type === "release" ? "release" : esc(c.act || "press")}</td><td>${c.ms ? c.ms + " ms" : ""}</td></tr>`).join("") + `</table>`;
}
function beatOf(t) { return GD.SYNC.timeToBeat(L.beats.grid, L.beats.offset, t); }
function timeOfBeat(b) { return GD.SYNC.beatToTime(L.beats.grid, L.beats.offset, b); }
// level beat b starts a bar when its song beat index is the grid's downbeat, mod 4
function isDownbeat(b) { const g = L.beats.grid, k = Math.round((timeOfBeat(b) + L.beats.offset - g.t0) / g.period); return ((k - g.downbeat) % 4 + 4) % 4 === 0; }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

// ---------- controls ----------
const playBtn = document.getElementById("play");
function setPlay() { playBtn.textContent = playing ? "❚❚ pause" : "▶ play"; }
playBtn.onclick = () => { if (!L) return; if (tick() >= L.path.length - 1) t = 0; playing = !playing; setPlay(); syncSong(true); };
document.getElementById("restart").onclick = () => { if (!L) return; t = 0; lastTick = -1; playing = true; setPlay(); syncSong(true); };
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
  speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); syncSong(true);
});
document.getElementById("hit").onclick = e => { showHit = !showHit; e.target.classList.toggle("on", showHit); draw(); };
document.getElementById("sound").onclick = e => { sound = !sound; e.target.classList.toggle("on", sound); };
document.getElementById("music").onclick = e => { music = !music; e.target.classList.toggle("on", music); syncSong(true); };
let showBeats = true;
document.getElementById("beatsBtn").onclick = e => { showBeats = !showBeats; e.target.classList.toggle("on", showBeats); draw(); };
const scrub = document.getElementById("scrub");
scrub.oninput = () => { t = scrub.value / 1000 * (L.path.length - 1) / P.TPS; lastTick = tick(); playing = false; setPlay(); syncSong(); draw(); };
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); playBtn.onclick(); }
  if (e.key === "r") document.getElementById("restart").onclick();
  if (e.key === "ArrowRight") { t += 1 / P.TPS * (e.shiftKey ? 24 : 1); playing = false; setPlay(); draw(); }
  if (e.key === "ArrowLeft") { t = Math.max(0, t - 1 / P.TPS * (e.shiftKey ? 24 : 1)); playing = false; setPlay(); draw(); }
});

let actx = null;
function beep() {
  if (!sound) return;
  actx = actx || new AudioContext();
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = 1320;
  g.gain.setValueAtTime(0.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.06);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.07);
}

// ---------- drawing ----------
function tick() { return Math.min(L.path.length - 1, Math.floor(t * P.TPS)); }
let W = 0, H = 0, scale = 1, camX = 0, camY = 0, groundY = 0;
function resize() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = r.width * d; cv.height = r.height * d; W = cv.width; H = cv.height;
  scale = H / (30 * 9.5); groundY = H - 30 * 1.6 * scale;
  if (L) draw();
}
addEventListener("resize", resize);
const sx = x => (x - camX) * scale, sy = y => groundY - (y - camY) * scale;

function draw() {
  if (!L) return;
  const k = tick(), s = L.path[k];
  camX = s.x - W / scale * 0.3;
  // flying modes: keep the player in view inside its corridor (the corridor is taller than the view)
  const viewH = groundY / scale;
  const want = isFinite(s.ceilY) && s.mode !== "cube"
    ? Math.max(s.floorY - 15, Math.min(s.y - viewH * 0.5, s.ceilY + 15 - viewH))
    : Math.max(0, s.y - 30 * 4.5);
  camY += (want - camY) * 0.15;
  ctx.fillStyle = "#0e0828"; ctx.fillRect(0, 0, W, H);
  // grid
  ctx.strokeStyle = "rgba(120,100,220,.10)"; ctx.lineWidth = 1;
  for (let gx = Math.floor(camX / 30) * 30; sx(gx) < W; gx += 30) { ctx.beginPath(); ctx.moveTo(sx(gx), 0); ctx.lineTo(sx(gx), groundY); ctx.stroke(); }
  for (let gy = 0; sy(gy) > 0; gy += 30) { ctx.beginPath(); ctx.moveTo(0, sy(gy)); ctx.lineTo(W, sy(gy)); ctx.stroke(); }
  // beat lines: one per beat, brighter on the first beat of a bar, numbered
  if (L.beats && showBeats) {
    const bA = beatOf(Math.max(0, tOfScreenX(0))), bB = beatOf(tOfScreenX(W)), d = devicePixelRatio || 1;
    ctx.font = `${11 * d}px system-ui`;
    for (let b = Math.max(1, Math.ceil(bA)); b <= bB; b++) {
      const x = sx(GD.SYNC.xOfT(L.beats.tl, timeOfBeat(b))), down = isDownbeat(b);
      ctx.strokeStyle = down ? "rgba(120,220,255,.55)" : "rgba(120,220,255,.22)"; ctx.lineWidth = down ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY); ctx.stroke();
      ctx.fillStyle = down ? "rgba(150,230,255,.9)" : "rgba(150,230,255,.5)"; ctx.fillText(String(b), x + 3 * d, 14 * d);
    }
  }
  // ground
  const gy = sy(0);
  ctx.fillStyle = "#1b1046"; ctx.fillRect(0, gy, W, H - gy);
  ctx.strokeStyle = "#7d6bff"; ctx.lineWidth = 3; ctx.shadowColor = "#7d6bff"; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); ctx.shadowBlur = 0;
  // end line
  ctx.strokeStyle = "rgba(61,255,176,.5)"; ctx.beginPath(); ctx.moveTo(sx(L.world.endX), 0); ctx.lineTo(sx(L.world.endX), groundY); ctx.stroke();
  // objects
  for (const o of L.level.objects) if (sx(o.x) > -60 && sx(o.x) < W + 60) drawObj(o);
  if (showHit) {
    ctx.lineWidth = 1.5;
    for (const b of L.world.solids) { ctx.strokeStyle = "#00e5ff"; rectW(b); }
    for (const b of L.world.hazards) { ctx.strokeStyle = "#ff2050"; rectW(b); }
  }
  // trail: yellow where the button is held
  ctx.lineWidth = 4;
  for (let i = Math.max(0, k - 120); i < k; i += 2) {
    const p = L.path[i], q = L.path[Math.min(i + 2, k)];
    ctx.strokeStyle = L.held[i] ? "rgba(255,225,77,.8)" : "rgba(61,255,176,.35)";
    ctx.beginPath(); ctx.moveTo(sx(p.x), sy(p.y)); ctx.lineTo(sx(q.x), sy(q.y)); ctx.stroke();
  }
  drawDeaths();
  drawInput(k);
  // ship corridor
  if (s.mode === "ship") {
    ctx.strokeStyle = "rgba(255,90,210,.6)"; ctx.lineWidth = 3;
    for (const yy of [s.floorY, s.ceilY]) { ctx.beginPath(); ctx.moveTo(0, sy(yy)); ctx.lineTo(W, sy(yy)); ctx.stroke(); }
  }
  // the player
  if (s.mode === "ship") drawShip(s); else drawCube(s);
  if (showHit) { ctx.strokeStyle = "#fff"; rectW({ x0: s.x - 15, x1: s.x + 15, y0: s.y - 15, y1: s.y + 15 }); ctx.strokeStyle = "#f0f"; rectW({ x0: s.x - 4.5, x1: s.x + 4.5, y0: s.y - 4.5, y1: s.y + 4.5 }); }
  // the click table row of the input just made (the button strip shows it in the view)
  L.sol.clicks.forEach((c, i) => {
    const age = (k - c.tick) / P.TPS;
    const row = document.getElementById("c" + i); if (row) row.classList.toggle("now", age >= 0 && age < 0.35);
  });
  if (s.dead) {
    ctx.fillStyle = "rgba(255,59,107,.9)"; ctx.font = "bold 22px system-ui"; ctx.fillText("✖ died on a " + s.why, sx(s.x) - 60, sy(s.y) - 50);
  } else if (s.done) {
    ctx.fillStyle = "rgba(61,255,176,.95)"; ctx.font = "bold 22px system-ui"; ctx.fillText("LEVEL COMPLETE", W / 2 - 90, 40);
  }
  document.getElementById("clock").textContent = `${(k / P.TPS).toFixed(2)} s · block ${(s.x / 30).toFixed(1)}` + (L.beats ? ` · beat ${beatOf(k / P.TPS).toFixed(1)}` : "") + ` · ${speed}×`;
  drawStrip(k);
  scrub.value = Math.round(k / Math.max(1, L.path.length - 1) * 1000);
}
// the input: a strip under the ground (lit where the button is held, a tick at each press,
// the past brighter than the future) and a button light in the corner
// where the player really died (tools/runs.js): GD's % is of the level's length (last object x)
function deathX(pct) { return pct / 100 * (L.world.endX - 90); }
function drawDeaths() {
  if (!L.deaths || !L.deaths.length) return;
  const y0 = groundY + 30 * 0.45 * scale;
  ctx.strokeStyle = "rgba(255,59,107,.85)"; ctx.fillStyle = "rgba(255,59,107,.95)"; ctx.lineWidth = 2;
  ctx.font = "bold 13px system-ui"; ctx.textAlign = "center";
  for (const pct of L.deaths) {
    const x = sx(deathX(pct));
    if (x < -20 || x > W + 20) continue;
    ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.moveTo(x, 18); ctx.lineTo(x, y0 - 8); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillText("✖ " + pct.toFixed(0) + "%", x, 14);
  }
  ctx.textAlign = "left";
}
function drawInput(k) {
  const y0 = groundY + 30 * 0.45 * scale, h = 30 * 0.5 * scale;
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(0, y0 - 6, W, h + 12);
  const n = L.path.length;
  // each click's timing window: a faint band around its mark
  for (const c of L.sol.clicks) {
    if (c.hi <= c.lo) continue;
    const x0 = sx(L.path[Math.min(c.lo, n - 1)].x), x1 = sx(L.path[Math.min(c.hi + 1, n - 1)].x);
    if (x1 < 0 || x0 > W) continue;
    ctx.fillStyle = "rgba(120,200,255,.35)"; ctx.fillRect(x0, y0 - 6, Math.max(2, x1 - x0), h + 12);
  }
  let a = 0; while (a < n - 1 && sx(L.path[a].x) < 0) a += 8;
  for (let i = Math.max(0, a - 8); i < n - 1 && sx(L.path[i].x) < W; i++) {
    if (!L.held[i]) continue;
    let j = i; while (j + 1 < n && L.held[j + 1]) j++;
    const xa = sx(L.path[i].x), xb = Math.max(xa + 3, sx(L.path[Math.min(j + 1, n - 1)].x));
    ctx.fillStyle = i <= k ? "rgba(255,225,77,.95)" : "rgba(255,225,77,.35)"; ctx.fillRect(xa, y0, xb - xa, h);
    ctx.fillStyle = "#fff"; ctx.fillRect(xa, y0 - 4, 2, h + 8); // the press
    i = j;
  }
  ctx.fillStyle = "#fff"; ctx.fillRect(sx(L.path[k].x) - 1, y0 - 6, 2, h + 12); // now
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.font = "12px system-ui"; ctx.fillText("button", 6, y0 - 6);
  // button light
  const on = L.held[k], bx = W - 28 * (devicePixelRatio || 1), by = y0 + h / 2 - 22;
  let since = k; while (since > 0 && L.held[since - 1] === on) since--;
  ctx.fillStyle = on ? "#ffe14d" : "rgba(255,255,255,.08)"; if (on) glow("#ffe14d", 18);
  ctx.fillStyle = "rgba(0,0,0,.8)"; ctx.fillRect(bx - 110, y0 - 6, 140, h + 12); ctx.fillStyle = on ? "#ffe14d" : "rgba(255,255,255,.08)"; if (on) glow("#ffe14d", 18);
  ctx.beginPath(); ctx.arc(bx, by + 22, Math.min(20, h / 2 + 4), 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = on ? "#0e0828" : "rgba(255,255,255,.6)"; ctx.font = "bold 12px system-ui"; ctx.textAlign = "center";
  ctx.fillText(on ? "HOLD" : "up", bx, by + 26);
  ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "11px system-ui";
  ctx.textAlign = "right"; ctx.fillText((on ? "held " : "up ") + ((k - since) / P.TPS).toFixed(2) + " s", bx - 28, by + 26); ctx.textAlign = "left";

// screen x -> level time (through the speed portals)
function tOfScreenX(px) { return L.beats ? GD.SYNC.tOfX(L.beats.tl, px / scale + camX) : 0; }

const strip = document.getElementById("strip"), sctx = strip.getContext("2d");
function drawStrip(k) {
  const d = devicePixelRatio || 1, r = strip.getBoundingClientRect();
  if (strip.width !== Math.round(r.width * d)) { strip.width = Math.round(r.width * d); strip.height = Math.round(r.height * d); }
  const SW = strip.width, SH = strip.height, total = Math.max(1e-6, (L.path.length - 1) / P.TPS), X = t => t / total * SW;
  sctx.fillStyle = "#120a2e"; sctx.fillRect(0, 0, SW, SH);
  if (L.beats && showBeats) {
    const last = Math.floor(beatOf(total));
    for (let b = 1; b <= last; b++) {
      const x = X(timeOfBeat(b)), down = isDownbeat(b);
      sctx.fillStyle = down ? "rgba(120,220,255,.75)" : "rgba(120,220,255,.3)";
      sctx.fillRect(Math.round(x), down ? 0 : SH * 0.45, Math.max(1, d), down ? SH : SH * 0.55);
    }
    for (const [kb, db] of L.beats.grid.sections || []) {
      const t = L.beats.grid.t0 + kb * L.beats.grid.period - L.beats.offset;
      if (t < 0 || t > total) continue;
      const x = X(t);
      sctx.fillStyle = db > 0 ? "#ff8a3d" : "#8a7dff";
      sctx.beginPath(); sctx.moveTo(x - 5 * d, db > 0 ? 9 * d : 1); sctx.lineTo(x + 5 * d, db > 0 ? 9 * d : 1); sctx.lineTo(x, db > 0 ? 1 : 9 * d); sctx.fill();
    }
  }
  for (const c of L.sol.clicks) if (c.type === "press") { sctx.fillStyle = "#ffe14d"; sctx.fillRect(Math.round(X(c.tick / P.TPS)) - d, SH * 0.55, 2 * d, SH * 0.45); }
  sctx.fillStyle = "#3dffb0"; sctx.fillRect(Math.round(X(k / P.TPS)) - d, 0, 2 * d, SH);
}
strip.onclick = e => {
  if (!L) return;
  const r = strip.getBoundingClientRect();
  t = (e.clientX - r.left) / r.width * (L.path.length - 1) / P.TPS; lastTick = tick(); playing = false; setPlay(); syncSong(); draw();
};
function rectW(b) { ctx.strokeRect(sx(b.x0), sy(b.y1), (b.x1 - b.x0) * scale, (b.y1 - b.y0) * scale); }
function local(o, fn) {
  ctx.save(); ctx.translate(sx(o.x), sy(o.y)); ctx.rotate((o.rot || 0) * Math.PI / 180);
  ctx.scale(scale * (o.flipX ? -1 : 1), -scale * (o.flipY ? -1 : 1)); fn(); ctx.restore();
}
function glow(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
function drawObj(o) {
  const d = GD.objInfo(o.id);
  if (d.kind === "decoration" || d.kind === "trigger") return;
  local(o, () => {
    ctx.lineWidth = 2 / scale;
    if (d.kind === "solid") {
      ctx.fillStyle = "rgba(61,123,255,.18)"; ctx.fillRect(-15, -15, 30, 30);
      glow("#3d7bff", 10); ctx.strokeStyle = "#5b8fff"; ctx.strokeRect(-14, -14, 28, 28);
    } else if (d.kind === "hazard" && d.shape === "saw") {
      glow("#ff3b6b", 10); ctx.strokeStyle = "#ff3b6b"; ctx.fillStyle = "rgba(255,59,107,.2)";
      ctx.beginPath(); ctx.arc(0, 0, d.r, 0, 7); ctx.fill(); ctx.stroke();
    } else if (d.kind === "hazard" && d.shape === "box") {
      const hb = d.hit; glow("#ff3b6b", 8); ctx.fillStyle = "rgba(255,59,107,.35)"; ctx.strokeStyle = "#ff3b6b";
      ctx.fillRect((hb.ox || 0) - hb.w / 2, (hb.oy || 0) - hb.h / 2, hb.w, hb.h); ctx.strokeRect((hb.ox || 0) - hb.w / 2, (hb.oy || 0) - hb.h / 2, hb.w, hb.h);
    } else if (d.kind === "hazard") {
      const top = d.shape === "smallspike" ? 0 : d.shape === "midspike" ? 4 : 15;
      ctx.beginPath(); ctx.moveTo(-14, -15); ctx.lineTo(14, -15); ctx.lineTo(0, top); ctx.closePath();
      ctx.fillStyle = "rgba(255,59,107,.25)"; ctx.fill(); glow("#ff3b6b", 10); ctx.strokeStyle = "#ff3b6b"; ctx.stroke();
    } else if (d.kind === "orb") {
      glow(d.color, 14); ctx.strokeStyle = d.color; ctx.lineWidth = 3 / scale;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fillStyle = d.color; ctx.globalAlpha = .6; ctx.fill(); ctx.globalAlpha = 1;
      if (d.dash) { ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(8, 0); ctx.lineTo(-6, 6); ctx.stroke(); }
    } else if (d.kind === "slope") {
      ctx.beginPath(); ctx.moveTo(-15, -15); ctx.lineTo(15, -15); ctx.lineTo(15, 15); ctx.closePath();
      ctx.fillStyle = "rgba(61,123,255,.18)"; ctx.fill(); glow("#3d7bff", 10); ctx.strokeStyle = "#5b8fff"; ctx.stroke();
    } else if (d.kind === "mode" || d.kind === "gravity") {

    } else if (d.kind === "speed") {

    } else if (d.kind === "pad") {

}
function drawShip(s) {
  local({ x: s.x, y: s.y, rot: s.rot }, () => {
    glow("#3dffb0", 18); ctx.fillStyle = "#3dffb0";
    ctx.beginPath(); ctx.moveTo(-17, -8); ctx.lineTo(17, -2); ctx.lineTo(-17, 9); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "#0e0828"; ctx.fillRect(-8, -1, 8, 7);
  });
}
function drawCube(s) {
  local({ x: s.x, y: s.y, rot: s.rot }, () => {
    glow("#3dffb0", 18);
    ctx.fillStyle = "#3dffb0"; ctx.fillRect(-15, -15, 30, 30);
    ctx.shadowBlur = 0; ctx.fillStyle = "#0e0828"; ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = "#3dffb0"; ctx.fillRect(-5, -5, 10, 10);
  });
}

// ---------- loop ----------
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (L && playing) {
    t += dt * speed;
    const k = tick();
    for (const c of L.sol.clicks) if (c.type === "press" && c.tick > lastTick && c.tick <= k) beep();
    lastTick = k;
    if (k >= L.path.length - 1) { playing = false; setPlay(); }
    syncSong(false);

  requestAnimationFrame(frame);
}
resize();
if (ALL.length) { pick.value = 0; pick.onchange(); }
requestAnimationFrame(frame);
</script>
